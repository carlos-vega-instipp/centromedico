{% extends 'application/base.html' %}

{% load static %}

{% block contenido %}
<div id="layoutSidenav_content">
    <main>
        <div class="container-fluid px-4">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-lg border-0 rounded-lg mt-5">
                        <div class="card-header">
                            <h3 class="text-center font-weight-light my-4">Registro de permiso
                            </h3>
                        </div>
                        <div class="card-body">
                            <form method="post" action="">
                                {% csrf_token %}
                                {% if error is not None %}
                                <div class="form-floating mb-3">
                                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                        {{ error }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert"
                                            aria-label="Close"></button>
                                    </div>

                                </div>
                                {% endif %}
                                <fieldset class="form-group">
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <div class="form-floating mb-3 mb-md-0">
                                                <input type="text" class="form-control" id="buscarUsuario"
                                                    placeholder="Escribe nombre o apellidos" autocomplete="off">
                                                <label for="buscarUsuario" class="form-label">Usuario</label>
                                                <!-- Lista de resultados -->
                                                <div id="resultadosUsuarios" class="list-group position-absolute w-100"
                                                    style="z-index: 1000;"></div>
                                                <!-- Campo oculto para guardar el ID real del usuario seleccionado -->
                                                <input type="hidden" id="usuario_id" name="usuario_id">
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-floating">
                                                 <input type="text" class="form-control" id="buscarRol"
                                                    placeholder="Escribe nombre del rol" autocomplete="off">
                                                <label for="buscarRol" class="form-label">Rol</label>
                                                <!-- Lista de resultados -->
                                                <div id="resultadosRoles" class="list-group position-absolute w-100"
                                                    style="z-index: 1000;"></div>
                                                <!-- Campo oculto para guardar el ID real del usuario seleccionado -->
                                                <input type="hidden" id="rol_id" name="rol_id">
                                            </div>
                                        </div>
                                    </div>
                                </fieldset>
                                <div class="mt-4 mb-0">
                                    <div class="d-grid">
                                        <input type="submit" value="Registrar permiso"
                                            class="btn btn-primary btn-block">
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'application/js/obtenerUsers.js' %}"></script>
<script src="{% static 'application/js/obtenerRols.js' %}"></script>
{% endblock %}
