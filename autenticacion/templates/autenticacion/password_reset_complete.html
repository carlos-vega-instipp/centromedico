{% extends "application/base.html" %}
{% load static %}

{% block content %}
<link href="{% static 'autenticacion/css/recuperar.css' %}" rel="stylesheet" />
<link href="{% static 'application/css/styles.css' %}" rel="stylesheet" />

<body style="background-color: blue;">
  <div id="layoutAuthentication">
    <div id="layoutAuthentication_content">
      <main>
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-6">
              <div class="card shadow-lg border-0 rounded-lg mt-5">
                <div class="card-header text-center">
                  <h3 class="font-weight-light my-4">Contraseña restablecida</h3>
                </div>
                <div class="card-body text-center">
                  <div class="alert alert-success" role="alert">
                    ✅ Tu contraseña ha sido restablecida con éxito.
                  </div>
                  <p class="mt-3">
                    Ahora puedes iniciar sesión con tu nueva contraseña.
                  </p>
                  <a href="{% url 'login' %}" class="btn btn-primary mt-3">Iniciar sesión</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
{% endblock %}
